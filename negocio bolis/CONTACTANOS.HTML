<html>

<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: antiquewhite;
            margin: 0;
        }

        h1 {
            font-size: 6em;
            color: #502d2d;
            font-weight: bolder;
            font-style: unset;
        }

        h2 {
            font-size: 4em;
            color: #613c3c;
            font-weight: bold;
            font-style: unset;
        }

        h3 {
            font-size: 4em;
            color: #3d2e0d;
            font-weight: bolder;
            font-style: oblique;
        }

        h5 {
            font-size: 2em;
            color: #ee9aff;
            font-weight: bolder;
            font-style: italic;
        }

        h6 {
            font-size: 2em;
            color: #7A8B6F;
            font-weight: bolder;
            font-style: italic;
        }

        p {
            font-size: 1em;
            color: #3D3D3D;
            font-weight: initial;
            font-style: unset;
        }

        .formulario {
            background-color: rgb(198, 198, 201);
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgb(238, 111, 213);
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid plum;
            border-radius: 8px;
            font-size: 15px;
            background-color: rgb(132, 68, 205);

        }

        h2 {
            text-align: center;
            color: palevioletred;
        }

        label {
            margin-top: 15px;
            margin-bottom: 6px;
            color: rgb(1, 7, 13);
            font-weight: bold;

        }

        textarea {
            height: 120px;
            resize: vertical;

        }

        button {
            width: 100%;
            background-color: beige;
            color: black;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 20px;


        }

        nav {

            background-color: rgb(246, 184, 248);
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: rgb(255, 255, 255);
            background-color: rgb(247, 118, 219);
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 10px;
            display: inline-block;
        }

        nav a:hover {
            background-color: rgb(255, 190, 244);
            color: rgb(241, 193, 239);
        }

        .tarjeta {
            background: #fffdf7;
            border: 3px solid #1a1a1a;
            grid-template-columns: 1fr 1fr 1fr;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 6px 6px 0 #1a1a1a;
        }
    </style>
</head>

<body>
    <div class="formulario">
        <h2>Contactanos</h2>
        <form action="#" method="post">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre">
            <label for="correo">Correo electronico</label>
            <input type="email" id="correo" name="correo">
            <label for="genero">Genero</label>
            <select name="genero" id="genero">
                <option value="">Selecionar </option>
                <option value="hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
                <option value="no_especificar">Prefiero no especificar</option>
            </select>
            <label for="edad">Edad:</label>
            <select name="edad" id="edad">
                <option value="">Seleccionar edad:</option>
                <option>15</option>
                <option>16</option>
                <option>17</option>
                <option>18</option>
                <option>19</option>
                <option>20</option>
                <option>21</option>
                <option>22</option>
                <option>23</option>
                <option>24</option>
                <option>25</option>
                <option>26</option>
                <option>27</option>
                <option>28</option>
                <option>29</option>
                <option>30</option>
                <option>31</option>
                <option>32</option>
                <option>33</option>
                <option>34</option>
                <option>35</option>
                <option>36</option>
                <option>37</option>
                <option>38</option>
                <option>39</option>
                <option>40</option>


            </select>
            <label for="comentarios">Comentarios</label>
            <textarea id="comentario" name="comentario">Escribe aquì:</textarea>
            <button type="submit">Enviar comentario</button>


        </form>
    </div>
</body>

</html>
