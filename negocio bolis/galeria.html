    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: antiquewhite;
            margin: 0;
        }

        h1 {
            font-size: 6em;
            color: #502d2d;
            font-weight: bolder;
            font-style: unset;
        }

        h2 {
            font-size: 4em;
            color: #613c3c;
            font-weight: bold;
            font-style: unset;
        }

        h3 {
            font-size: 4em;
            color: #f5ad28;
            font-weight: bolder;
            font-style: oblique;
        }

        h5 {
            font-size: 2em;
            color: #ee9aff;
            font-weight: bolder;
            font-style: italic;
        }

        h6 {
            font-size: 2em;
            color: #7A8B6F;
            font-weight: bolder;
            font-style: italic;
        }

        p {
            font-size: 1em;
            color: #3D3D3D;
            font-weight: initial;
            font-style: unset;
        }

        img {
            width: 30%;
            height: 30%;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(223, 61, 174, 0.2);
        }

        nav {

            background-color: rgb(246, 184, 248);
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: rgb(255, 255, 255);
            background-color: rgb(247, 118, 219);
            text-decoration: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 10px;
            display: inline-block;
        }

        nav a:hover {
            background-color: rgb(255, 190, 244);
            color: rgb(241, 193, 239);
        }

        .tarjeta {
            background: #fffdf7;
            border: 3px solid #1a1a1a;
            grid-template-columns: 1fr 1fr 1fr;
            border-radius: 16px;
            padding: 20px 24px;
            box-shadow: 6px 6px 0 #1a1a1a;
        }

        .galeria {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
        }

        .galeria img {
            width: 200px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid;
            box-shadow: 0 4px 10px #999;
            transition: all 0.3s ease;
        }

        .galeria img:hover {
            transform: scale(1, 1);
            border-color: #9a9676;
            box-shadow: 0 10px 25px #e276f8;
            cursor: pointer;
        }

        nav {

            background-color: rgb(246, 184, 248);

            border-radius: 16px;

        }
